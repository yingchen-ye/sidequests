<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidequests</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12142b;
        color: #eceaf5;
        font-family: -apple-system, BlinkMacSystemFont, "IBM Plex Sans", sans-serif;
      }
      main {
        max-width: 480px;
        padding: 2rem;
        text-align: left;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
        letter-spacing: -0.01em;
      }
      p {
        color: #9a9dc2;
        margin-top: 0;
        margin-bottom: 2rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a {
        display: block;
        padding: 1rem 1.25rem;
        border-radius: 12px;
        background: #1c1f3d;
        color: #eceaf5;
        text-decoration: none;
        border: 1px solid #2a2e57;
      }
      a:hover {
        border-color: #e2483d;
      }
      .name {
        font-weight: 600;
      }
      .desc {
        display: block;
        color: #9a9dc2;
        font-size: 0.875rem;
        margin-top: 0.15rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>sidequests</h1>
      <p>A small collection of personal apps.</p>
      <ul>
        <li>
          <a href="./trip-planner/">
            <span class="name">Trip Planner</span>
            <span class="desc">Itinerary, map, and expenses for the China trip</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
